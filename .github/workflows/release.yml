name: release

# Tag a commit and this builds the .vsix and attaches it to a GitHub release, so the
# Releases page always offers the current English build.
#
#   git tag v0.8.44 && git push origin v0.8.44
#
# The tag tracks upstream's version: this fork adds no features, so matching numbers
# make it obvious which upstream release an English build corresponds to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translation gate
        run: npm run l10n:check

      - name: Tests
        run: npm test

      - name: Build the .vsix
        run: mkdir -p dist && npx --yes @vscode/vsce package --out dist/

      - name: Upload the .vsix as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

      - name: Attach the .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "English edition of DeepSeek Harness for VS Code.

          Install with:
          \`\`\`
          code --install-extension $(basename dist/*.vsix)
          \`\`\`

          Based on upstream $(node -p "require('./package.json').version")." \
          || gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber
